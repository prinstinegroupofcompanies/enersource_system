# Render Blueprint — Enersource ERP API
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: enersource-api
    runtime: node
    region: oregon
    plan: free
    rootDir: server
    buildCommand: chmod +x scripts/render-build.sh && ./scripts/render-build.sh
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_PROVIDER
        value: postgresql
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: MFA_ISSUER
        value: EnerSource ERP
      - key: CLIENT_URL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: enersource-db
          property: connectionString

databases:
  - name: enersource-db
    plan: free
    databaseName: enersource_erp
    user: enersource
